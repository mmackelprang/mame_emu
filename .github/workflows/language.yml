name: Compile UI translations

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - 'language/**'
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'language/**'

permissions:
  contents: read

jobs:
  # Canary: this is a GitHub-hosted-only leg (no appserver fallback -- it can't
  # run on the Linux self-hosted runner). Run ONLY when the GitHub backend is
  # active; skip when forced to appserver (CI_FORCE_APPSERVER=true) or when GH
  # minutes are exhausted (probe can't run) -- skipping rather than burning
  # credits. See docs/ci/appserver-runner.md.
  probe-github:
    if: ${{ vars.CI_FORCE_APPSERVER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      gh_ok: ${{ steps.probe.outputs.gh_ok }}
    steps:
    - id: probe
      run: echo "gh_ok=true" >> "$GITHUB_OUTPUT"

  build-language:
    needs: probe-github
    if: ${{ !cancelled() && needs.probe-github.outputs.gh_ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Compile message catalogs
      run: for x in language/*/*.po ; do python scripts/build/msgfmt.py --output-file "`dirname "$x"`/`basename "$x" .po`.mo" "$x" ; done
    - uses: actions/upload-artifact@main
      with:
        name: mame-language-${{ github.sha }}
        path: language/*/*.mo
        if-no-files-found: error
