name: CI (Linux)

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'hash/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  # --- Canary fallback: try GitHub-hosted, fall back to appserver -----------
  # This no-op runs on a GitHub-hosted runner. If it runs, GH-hosted is available
  # and it emits gh_ok=true, so the Linux gates below run on ubuntu-latest. If
  # GitHub Actions minutes are exhausted the job cannot run, gh_ok is unset, and
  # the gates fall back to the appserver self-hosted runner (free, never consumes
  # minutes). continue-on-error keeps the run green on fallback.
  # KILL-SWITCH: set repo variable CI_FORCE_APPSERVER=true to skip this probe and
  # force appserver everywhere -- the guaranteed manual override if auto-detection
  # ever misbehaves (e.g. transient GH saturation). See docs/ci/appserver-runner.md.
  probe-github:
    if: ${{ vars.CI_FORCE_APPSERVER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      gh_ok: ${{ steps.probe.outputs.gh_ok }}
    steps:
    - id: probe
      run: echo "gh_ok=true" >> "$GITHUB_OUTPUT"

  # Fast pre-flight that gates the multi-hour matrix legs (ADR 0005 decision #3).
  # It builds only the tiny slice (SUBTARGET=tiny -> mametiny, ~95 drivers, minutes
  # not hours), then runs -validate and the reconcile CHECK form on tiny.lst, so
  # obvious breakage fails in minutes instead of after the full build. The reconcile
  # step uses the CHECK form ONLY -- never --fix (--fix is a local-only developer
  # tool and must never run in CI). The full build-linux matrix legs still run, but
  # only after this job passes (see `needs: preflight` below), giving fail-fast
  # feedback before the long legs start.
  preflight:
    # Canary fallback: GitHub-hosted when available, else the appserver
    # self-hosted runner. See docs/ci/appserver-runner.md.
    needs: probe-github
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.probe-github.outputs.gh_ok == 'true' && '["ubuntu-latest"]' || '["self-hosted","linux","x64","appserver"]') }}
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build tiny slice
      env:
        SUBTARGET: tiny
        TOOLS: 1
      run: make -j"$(nproc)"
    - name: Validate
      run: ./mametiny -validate
    - name: Reconcile driver list (check only)
      run: ./mametiny -listxml | python3 scripts/build/makedep.py reconcilelist -l src/mame/tiny.lst -

  # ADR 0001/0006 differential CPU oracle -- the load-bearing correctness gate.
  # Runs on the appserver self-hosted runner. Builds the tiny slice + the
  # mametests Catch2 binary (TESTS=1) -- minutes, not the multi-hour full-mame
  # matrix -- then runs the FULL corpus with no cap, incl. the m68000 Leg-A probe
  # (z80 ~45M + m6502 ~33M assertions + m68000 127 files / 317.5k cases per
  # ADR 0006 owner decision #3).
  # Runs ONLY on the appserver fallback path: when GitHub-hosted is active, the
  # build-linux matrix below already runs the oracle, so this standalone job is
  # skipped to avoid running the full corpus twice.
  oracle:
    needs: [probe-github, preflight]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.probe-github.outputs.gh_ok != 'true' }}
    runs-on: [self-hosted, linux, x64, appserver]
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Build mametests (tiny slice + Catch2 tests)
      env:
        SUBTARGET: tiny
        TESTS: 1
        TOOLS: 1
      run: make -j"$(nproc)"
    - name: Fetch CPU oracle vectors
      run: python3 tests/cpuoracle/fetch_vectors.py --cores z80,m6502,m68000
    - name: Run mametests (full oracle + legacy unit tests, no cap)
      run: ./mametests
    # O-mem-2 (ADR 0007 W4): the default run above is the 1-cycle Leg B, which only
    # exercises each native opcode's FIRST bus step.  The fully-granted pass grants
    # the instruction's length so the WHOLE native instruction -- including the data
    # WRITE -- runs native; it is a BLOCKING gate for the m68000 DRC memory-EA work.
    # Also run the portable C backend (drcbec) to catch backend-divergent emission.
    # Full corpus, no cap (this appserver job is the load-bearing correctness gate).
    - name: Run m68000 DRC Leg B -- fully-granted pass (native write, ADR 0007 W4)
      env:
        CPUORACLE_M68_DRC_FULLGRANT: "1"
      run: ./mametests "[m68000][drc]"
    - name: Run m68000 DRC Leg B -- C backend (drcbec)
      env:
        CPUORACLE_M68_DRC_C: "1"
      run: ./mametests "[m68000][drc]"
    - name: Run m68000 DRC Leg B -- fully-granted C backend
      env:
        CPUORACLE_M68_DRC_FULLGRANT: "1"
        CPUORACLE_M68_DRC_C: "1"
      run: ./mametests "[m68000][drc]"

  # The heavy cross-compiler full-mame build matrix is GitHub-hosted only -- it is
  # about cross-compiler coverage the single appserver box can't replicate, and it
  # already runs the oracle as part of each leg. It runs ONLY when the GitHub
  # backend is active (probe-github succeeded); on the appserver fallback path it
  # is skipped and the standalone `oracle` job above is the correctness gate.
  build-linux:
    needs: [probe-github, preflight]
    if: ${{ !cancelled() && needs.probe-github.outputs.gh_ok == 'true' && needs.preflight.result == 'success' }}
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            archopts: -U_FORTIFY_SOURCE
            subtarget: tiny
            executable: mametiny
            # gcc leg runs a representative oracle subset (the clang leg below is
            # the canonical full-corpus gate) -- avoids replaying the full m68000
            # corpus (317.5k cases) twice per push.
            oracle_cap: "64"
          - compiler: clang
            cc: clang
            cxx: clang++
            subtarget: mame
            executable: mame
            # clang leg is the CANONICAL gate: full corpus, no cap (empty == all).
            oracle_cap: ""
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Install clang
      if: matrix.compiler == 'clang'
      run: sudo apt-get install -y clang
    - name: Build
      env:
        OVERRIDE_CC: ${{ matrix.cc }}
        OVERRIDE_CXX: ${{ matrix.cxx }}
        ARCHOPTS: ${{ matrix.archopts }}
        SUBTARGET: ${{ matrix.subtarget }}
        TOOLS: 1
        # TESTS=1 also builds the `mametests` Catch2 binary (the four legacy
        # unit tests + the differential CPU oracle), run below (ADR 0001 / 0006).
        TESTS: 1
      run: make -j3
    - name: Validate
      run: ./${{ matrix.executable }} -validate
    - name: Reconcile driver list
      run: ./${{ matrix.executable }} -listxml | python3 scripts/build/makedep.py reconcilelist -l src/mame/${{ matrix.subtarget }}.lst -
    # --- ADR 0001 boundary D: mametests + the differential CPU oracle ---------
    # Fetch the pinned, hash-verified SingleStepTests corpus (z80 + m6502 +
    # m68000) into the gitignored build/cpuoracle/ cache.  The fetcher pins an
    # immutable upstream ref + a per-archive SHA-256 and falls back across the
    # mirrors[] list in manifest.json; CI's primary source is codeload.github.com
    # (mirror 0), with github.com/.../archive as the fallback.  A fetch failure
    # exits non-zero and fails the leg LOUDLY -- the oracle is never silently
    # skipped in CI (the in-harness "skip if fixtures absent" path is for a
    # developer without the corpus, not for CI).
    - name: Fetch CPU oracle vectors
      run: python3 tests/cpuoracle/fetch_vectors.py --cores z80,m6502,m68000
    # The clang/mame leg is the CANONICAL oracle gate: it runs the FULL corpus
    # with no CPUORACLE_MAX_FILES cap (matrix.oracle_cap is empty == all) --
    # including the full m68000 corpus (127 files / 317.5k cases) per ADR 0006
    # owner decision #3.  This is the load-bearing m68000 Leg-A probe.  The
    # gcc/tiny leg runs a documented representative subset (oracle_cap=64) to
    # avoid replaying the full corpus twice per push; mac/windows likewise cap.
    - name: Run mametests (oracle + legacy unit tests)
      env:
        CPUORACLE_MAX_FILES: ${{ matrix.oracle_cap }}
      run: ./mametests
    # O-mem-2 (ADR 0007 W4): the fully-granted Leg-B pass exercises the native
    # multi-step path incl. the data WRITE (the 1-cycle pass cannot reach it); plus
    # the portable C backend (drcbec).  Blocking gates on the GitHub-hosted path
    # (mirrors the appserver `oracle` job above).  Uses the same per-leg corpus cap.
    - name: Run m68000 DRC Leg B -- fully-granted pass (native write, ADR 0007 W4)
      env:
        CPUORACLE_MAX_FILES: ${{ matrix.oracle_cap }}
        CPUORACLE_M68_DRC_FULLGRANT: "1"
      run: ./mametests "[m68000][drc]"
    - name: Run m68000 DRC Leg B -- C backend (drcbec)
      env:
        CPUORACLE_MAX_FILES: ${{ matrix.oracle_cap }}
        CPUORACLE_M68_DRC_C: "1"
      run: ./mametests "[m68000][drc]"
    - name: Run m68000 DRC Leg B -- fully-granted C backend
      env:
        CPUORACLE_MAX_FILES: ${{ matrix.oracle_cap }}
        CPUORACLE_M68_DRC_FULLGRANT: "1"
        CPUORACLE_M68_DRC_C: "1"
      run: ./mametests "[m68000][drc]"
    - name: ORM check
      run: python3 scripts/minimaws/minimaws.py load --executable ./${{ matrix.executable }} --softwarepath hash
    - uses: actions/upload-artifact@main
      with:
        name: ${{ matrix.executable }}-linux-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          ${{ matrix.executable }}
          chdman
          unidasm
        if-no-files-found: error
