name: Rebuild BGFX shaders

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - 'src/osd/modules/render/bgfx/shaders/**'
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'src/osd/modules/render/bgfx/shaders/**'

permissions:
  contents: read

jobs:
  # Canary: this is a GitHub-hosted-only leg (no appserver fallback -- it can't
  # run on the Linux self-hosted runner). Run ONLY when the GitHub backend is
  # active; skip when forced to appserver (CI_FORCE_APPSERVER=true) or when GH
  # minutes are exhausted (probe can't run) -- skipping rather than burning
  # credits. See docs/ci/appserver-runner.md.
  probe-github:
    if: ${{ vars.CI_FORCE_APPSERVER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      gh_ok: ${{ steps.probe.outputs.gh_ok }}
    steps:
    - id: probe
      run: echo "gh_ok=true" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: probe-github
    if: ${{ !cancelled() && needs.probe-github.outputs.gh_ok == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        install: git make mingw-w64-x86_64-gcc mingw-w64-x86_64-python mingw-w64-x86_64-libc++
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Prevent make from rebuilding GLSL parser source
      run: |
        touch 3rdparty/bgfx/3rdparty/glsl-optimizer/src/glsl/glcpp/glcpp-lex.c
        touch 3rdparty/bgfx/3rdparty/glsl-optimizer/src/glsl/glcpp/glcpp-parse.c
        touch 3rdparty/bgfx/3rdparty/glsl-optimizer/src/glsl/glcpp/glcpp-parse.h
        touch 3rdparty/bgfx/3rdparty/glslang/glslang/MachineIndependent/glslang_tab.cpp
        touch 3rdparty/bgfx/3rdparty/glslang/glslang/MachineIndependent/glslang_tab.cpp.h
    - name: Build
      env:
        MINGW64: "/mingw64"
      run: make shaders
    - uses: actions/upload-artifact@main
      with:
        name: mame-bgfx-${{ github.sha }}
        path: bgfx/shaders
        if-no-files-found: error
