name: Build documentation

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - 'docs/**'
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'docs/**'

permissions:
  contents: read

jobs:
  # Canary: this is a GitHub-hosted-only leg (no appserver fallback -- it can't
  # run on the Linux self-hosted runner). Run ONLY when the GitHub backend is
  # active; skip when forced to appserver (CI_FORCE_APPSERVER=true) or when GH
  # minutes are exhausted (probe can't run) -- skipping rather than burning
  # credits. See docs/ci/appserver-runner.md.
  probe-github:
    if: ${{ vars.CI_FORCE_APPSERVER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      gh_ok: ${{ steps.probe.outputs.gh_ok }}
    steps:
    - id: probe
      run: echo "gh_ok=true" >> "$GITHUB_OUTPUT"

  build-docs:
    needs: probe-github
    if: ${{ !cancelled() && needs.probe-github.outputs.gh_ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin latexmk python3-pip python3-sphinx texlive texlive-formats-extra texlive-science
        pip3 install sphinxcontrib-svg2pdfconverter
    - name: Build HTML
      run: make -C docs html
    - name: Build PDF
      run: make -C docs PAPER=a4 latexpdf
    - uses: actions/upload-artifact@main
      with:
        name: mame-docs-${{ github.sha }}
        path: |
          docs/build/html
          docs/build/latex/MAME.pdf
        if-no-files-found: error
