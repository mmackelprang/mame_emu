name: CI (Windows)

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-windows:
    strategy:
      matrix:
        compiler: [gcc-x64, clang-x64]
        include:
          - compiler: gcc-x64
            os: windows-latest
            msys: UCRT64
            slug: mingw-w64-ucrt-x86_64
            cc: gcc
            cxx: g++
            subtarget: mame
            executable: mame
          - compiler: clang-x64
            os: windows-latest
            msys: CLANG64
            slug: mingw-w64-clang-x86_64
            extrapkg: mingw-w64-clang-x86_64-gcc-compat
            cc: clang
            cxx: clang++
            subtarget: tiny
            executable: mametiny
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
      with:
        msystem: ${{ matrix.msys }}
        install: git make ${{ matrix.slug }}-${{ matrix.cc }} ${{ matrix.slug }}-python ${{ matrix.slug }}-lld ${{ matrix.slug }}-llvm ${{ matrix.slug }}-libc++ ${{ matrix.extrapkg }}
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Build
      env:
        OVERRIDE_AR: "llvm-ar"
        OVERRIDE_CC: ${{ matrix.cc }}
        OVERRIDE_CXX: ${{ matrix.cxx }}
        ARCHOPTS: "-fuse-ld=lld"
        SUBTARGET: ${{ matrix.subtarget }}
        TOOLS: 1
        TESTS: 1
      run: make -j3
    - name: Validate
      run: ./${{ matrix.executable }}.exe -validate
    - name: Fetch CPU oracle vectors
      run: python tests/cpuoracle/fetch_vectors.py --cores z80,m6502,m68000
    - name: Run mametests (oracle subset + legacy unit tests)
      env:
        CPUORACLE_MAX_FILES: 64
      run: ./mametests.exe
    - uses: actions/upload-artifact@main
      if: ${{ github.event_name == 'push' }}
      with:
        name: ${{ matrix.executable }}-windows-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          ${{ matrix.executable }}.exe
          chdman.exe
          unidasm.exe
        if-no-files-found: error
        retention-days: 7
