name: CI (macOS)

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl3
    - name: Build
      env:
        USE_LIBSDL: 1
        TOOLS: 1
        TESTS: 1
      run: make -j2
    - name: Validate
      run: ./mame -validate
    - name: Fetch CPU oracle vectors
      run: python3 tests/cpuoracle/fetch_vectors.py --cores z80,m6502,m68000
    - name: Run mametests (oracle subset + legacy unit tests)
      env:
        CPUORACLE_MAX_FILES: 64
      run: ./mametests
    - uses: actions/upload-artifact@main
      if: ${{ github.event_name == 'push' }}
      with:
        name: mame-macos-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
        retention-days: 7
