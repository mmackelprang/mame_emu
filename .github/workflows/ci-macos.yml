name: CI (macOS)

on:
  push:
    branches:
    - main
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'tests/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  # Canary: this is a GitHub-hosted-only leg (no appserver fallback -- it can't
  # run on the Linux self-hosted runner). Run ONLY when the GitHub backend is
  # active; skip when forced to appserver (CI_FORCE_APPSERVER=true) or when GH
  # minutes are exhausted (probe can't run) -- skipping rather than burning
  # credits. See docs/ci/appserver-runner.md.
  probe-github:
    if: ${{ vars.CI_FORCE_APPSERVER != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      gh_ok: ${{ steps.probe.outputs.gh_ok }}
    steps:
    - id: probe
      run: echo "gh_ok=true" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: probe-github
    if: ${{ !cancelled() && needs.probe-github.outputs.gh_ok == 'true' }}
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl3
    - name: Build
      env:
        USE_LIBSDL: 1
        TOOLS: 1
        # TESTS=1 also builds the `mametests` Catch2 binary (legacy unit tests +
        # the differential CPU oracle), run below (ADR 0001 / 0006).
        TESTS: 1
      run: make -j2
    - name: Validate
      run: ./mame -validate
    # --- ADR 0001 boundary D: mametests + the differential CPU oracle ---------
    # Fetch the pinned, hash-verified SingleStepTests corpus.  A fetch failure
    # exits non-zero and fails the leg loudly (the oracle is never silently
    # skipped in CI).  Primary source is codeload.github.com with a github.com
    # archive fallback (manifest.json mirrors[]).
    - name: Fetch CPU oracle vectors
      run: python3 tests/cpuoracle/fetch_vectors.py --cores z80,m6502,m68000
    # COST CAP (documented, not silent): the macOS runner is the scarcest/most
    # expensive leg, so it runs a REPRESENTATIVE SUBSET -- the first 64 fixture
    # files per core (CPUORACLE_MAX_FILES=64) -- as a cross-platform smoke that
    # the oracle harness + the test binary behave on macOS.  The FULL-corpus
    # m68000 gate (ADR 0006 decision #3) runs on Linux (the canonical leg); this
    # cap never weakens that gate.
    - name: Run mametests (oracle subset + legacy unit tests)
      env:
        CPUORACLE_MAX_FILES: 64
      run: ./mametests
    - uses: actions/upload-artifact@main
      with:
        name: mame-macos-${{ github.sha }}
        path: |
          mame
          chdman
          unidasm
        if-no-files-found: error
